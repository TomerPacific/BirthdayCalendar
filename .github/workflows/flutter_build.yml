name: Flutter Build

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.6.0'

      - run: dart pub get
      
      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test